<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان منون الشامل - Oracle Financials 🌸✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 30px);
        }

        /* === SIDEBAR === */
        .sidebar {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            border: 3px solid #ffb3c6;
            box-shadow: 0 10px 30px rgba(255, 143, 171, 0.3);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 30px);
            position: sticky;
            top: 15px;
            overflow: hidden;
        }

        .sidebar h2 {
            color: #d90429;
            font-size: 1.4em;
            text-align: center;
            margin-bottom: 10px;
        }

        .score-display {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 700;
            color: #c9184a;
            font-size: 1.1em;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
        }

        .filter-btn {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            color: #c9184a;
            padding: 5px 10px;
            border-radius: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.72em;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn:hover { background: #ffd6e0; }
        .filter-btn.active {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            color: #fff;
            border-color: #c9184a;
        }

        .q-grid-title {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 600;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            overflow-y: auto;
            flex: 1;
            padding: 4px;
            align-content: start;
        }

        .q-num {
            aspect-ratio: 1;
            border: 2px solid #e0e0e0;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.85em;
            cursor: pointer;
            transition: 0.15s;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .q-num:hover { transform: scale(1.1); border-color: #ff8fa3; }
        .q-num.current {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            color: #fff;
            border-color: #c9184a;
            box-shadow: 0 0 0 3px rgba(255, 77, 109, 0.3);
        }
        .q-num.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .q-num.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        .q-num.hidden { display: none; }

        .legend {
            display: flex;
            justify-content: space-around;
            font-size: 0.7em;
            color: #666;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #ffccd5;
        }

        .legend span { display: flex; align-items: center; gap: 3px; }
        .legend i {
            width: 10px; height: 10px;
            border-radius: 3px;
            display: inline-block;
        }

        /* === MAIN CONTENT === */
        .quiz-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 143, 171, 0.3);
            padding: 25px;
            border: 3px solid #ffb3c6;
            display: flex;
            flex-direction: column;
        }

        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { color: #d90429; font-size: 1.8em; }
        .header p { color: #ff4d6d; font-weight: 700; }

        .progress-container {
            width: 100%;
            background-color: #ffeff3;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff758f, #ff4d6d);
            width: 0%;
            transition: width 0.4s ease;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-btn {
            flex: 1;
            background: #fff0f3;
            border: 2px solid #ffccd5;
            color: #c9184a;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
        }

        .nav-btn:hover { background: #ffd6e0; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.primary {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            color: #fff;
            border-color: #c9184a;
        }

        .module-badge {
            display: inline-block;
            background: #ffe5ec;
            color: #c9184a;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .question-text {
            font-family: Arial, sans-serif;
            direction: ltr;
            text-align: left;
            font-size: 1.2em;
            color: #2b2d42;
            margin-bottom: 15px;
            font-weight: bold;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #ff4d6d;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            direction: ltr;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #4a4e69;
            font-family: Arial, sans-serif;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #fff0f3;
            border-color: #ff8fa3;
            transform: translateX(5px);
        }

        .option-btn:disabled { cursor: not-allowed; transform: none; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.3s;
        }

        .feedback.correct-bg { background-color: #e6ffed; border: 2px solid #a3e6b5; }
        .feedback.wrong-bg { background-color: #fff0f0; border: 2px solid #ffcaca; }

        .feedback-title { font-size: 1.3em; font-weight: 900; margin-bottom: 6px; }

        .explanation {
            font-family: Arial, sans-serif;
            direction: ltr;
            text-align: left;
            color: #333;
            font-size: 1em;
            line-height: 1.5;
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            margin-top: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === RESULT === */
        .result-screen { display: none; text-align: center; padding: 20px; }
        .result-screen h2 { color: #c9184a; font-size: 2.2em; margin-bottom: 15px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat-box {
            background: #fff0f3;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #ffccd5;
        }

        .stat-box .num { font-size: 1.8em; font-weight: 900; color: #c9184a; }
        .stat-box .lbl { font-size: 0.85em; color: #666; }

        /* Mobile */
        @media (max-width: 900px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                max-height: 400px;
            }
            .question-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="app-layout">

    <!-- === SIDEBAR === -->
    <aside class="sidebar">
        <h2>🌸 منون العبقرية</h2>

        <div class="score-display" id="score-display">
            النتيجة: 0 / 0
        </div>

        <div class="filters" id="filters">
            <button class="filter-btn active" data-module="all">الكل</button>
            <button class="filter-btn" data-module="Cash Management">Cash Mgmt</button>
            <button class="filter-btn" data-module="Fixed Assets">Fixed Assets</button>
            <button class="filter-btn" data-module="General Ledger">GL</button>
            <button class="filter-btn" data-module="Receivables">Receivables</button>
            <button class="filter-btn" data-module="GL & AP">GL & AP</button>
            <button class="filter-btn" data-module="Oracle Fusion Tax">Tax</button>
        </div>

        <div class="q-grid-title">اضغطي على رقم السؤال للانتقال السريع</div>

        <div class="question-grid" id="question-grid"></div>

        <div class="legend">
            <span><i style="background:#f8f9fa;border:2px solid #e0e0e0"></i> لم يُجب</span>
            <span><i style="background:#d4edda;border:2px solid #28a745"></i> صح</span>
            <span><i style="background:#f8d7da;border:2px solid #dc3545"></i> غلط</span>
        </div>

        <button class="nav-btn primary" style="margin-top:12px;" onclick="showResults()">عرض النتيجة 🏁</button>
        <button class="nav-btn" style="margin-top:6px;" onclick="resetQuiz()">إعادة البدء 🔄</button>
    </aside>

    <!-- === MAIN === -->
    <main class="quiz-container">

        <div id="quiz-screen">
            <div class="header">
                <h1>مراجعة Oracle Financials الشاملة</h1>
                <p id="progress-text">سؤال 1 من 1</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">⬅️ السابق</button>
                <button class="nav-btn primary" id="next-btn-top" onclick="nextQuestion()">التالي ➡️</button>
            </div>

            <div style="text-align:center;">
                <span class="module-badge" id="module-badge">Module</span>
            </div>

            <div class="question-text" id="question">Loading...</div>

            <div class="options-container" id="options"></div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedback-title"></div>
                <div id="feedback-encouragement" style="font-weight:bold; margin-bottom: 8px;"></div>
                <div class="explanation" id="explanation"></div>
            </div>

            <button class="nav-btn primary" id="next-btn-bottom" style="display:none; margin-top:15px;" onclick="nextQuestion()">السؤال اللي بعده يا بطلة 🚀</button>
        </div>

        <div class="result-screen" id="result-screen">
            <h2>خلصنا يا قمر! 🎉</h2>
            <div style="font-size: 4em; margin: 15px 0;">💖🎓</div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="num" id="stat-total">0</div>
                    <div class="lbl">إجمالي</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="stat-correct" style="color:#28a745;">0</div>
                    <div class="lbl">صح ✅</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="stat-wrong" style="color:#dc3545;">0</div>
                    <div class="lbl">غلط ❌</div>
                </div>
            </div>

            <h3 style="font-size: 1.8em; color: #2b2d42;">نسبتك: <span id="final-score" style="color: #d90429;"></span></h3>
            <p id="final-message" style="font-size: 1.3em; margin-top: 15px; color: #4a4e69;"></p>

            <button class="nav-btn primary" style="margin-top:20px; max-width:300px; margin-left:auto; margin-right:auto; display:block;" onclick="resetQuiz()">عايزة تعيدي تاني؟ 🔄</button>
        </div>

    </main>

</div>

<script>
// ============ BANK OF QUESTIONS ============
const allQuestions = [
    // ===== CASH MANAGEMENT =====
    { module: "Cash Management", q: "What provides the legal and operational foundation for internal accounts, supplier/customer banking, payment formats, and cash reporting?",
      options: ["A) Bank master data", "B) Chart of Accounts", "C) Legal Entity", "D) Accounting Calendar"],
      correctIndex: 0,
      explanation: "Bank master data provides the legal and operational foundation for internal accounts, supplier/customer banking, payment formats, statement import, and cash reporting." },

    { module: "Cash Management", q: "Which of the following is NOT one of the four bank setup components?",
      options: ["A) Bank", "B) Bank branch", "C) Internal account ownership", "D) Depreciation method"],
      correctIndex: 3,
      explanation: "The four components are: Bank, Bank branch, Internal account ownership, Bank account control. Depreciation belongs to Fixed Assets." },

    { module: "Cash Management", q: "In the five-step configuration path for Bank setup, what is the FIRST step?",
      options: ["A) Create bank", "B) Define standards", "C) Create branch", "D) Validate reuse"],
      correctIndex: 1,
      explanation: "Step 1 is 'Define standards' — document required bank/branch identifiers, naming, duplicate checks, and source evidence by country." },

    { module: "Cash Management", q: "Which step involves adding routing identifiers, contacts, branch attributes, and relationship to the bank?",
      options: ["A) Create bank", "B) Create branch", "C) Assign responsibility", "D) Validate reuse"],
      correctIndex: 1,
      explanation: "Step 3 'Create branch' — Add routing identifiers, contacts, branch attributes, and relationship to the bank." },

    { module: "Cash Management", q: "What does 'Assign responsibility' in bank configuration mean?",
      options: ["A) Assign bank to legal entity", "B) Separate bank-master maintenance, account creation, payment setup, and reconciliation access", "C) Assign bank to business unit", "D) Assign currency to bank"],
      correctIndex: 1,
      explanation: "Step 4 is about segregation of duties — separating who maintains bank master data vs. who creates accounts vs. payment setup vs. reconciliation." },

    { module: "Cash Management", q: "What is the purpose of 'Validate reuse' step?",
      options: ["A) Delete old banks", "B) Search before creation and confirm the bank/branch can support intended account and file formats", "C) Create new bank", "D) Approve bank changes"],
      correctIndex: 1,
      explanation: "Step 5 'Validate reuse' — Search before creation and confirm the bank/branch can support the intended account and file formats." },

    { module: "Cash Management", q: "Which control prevents duplicate banks?",
      options: ["A) Change approval", "B) Duplicate prevention", "C) Inactive-data policy", "D) Dual approval"],
      correctIndex: 1,
      explanation: "CONTROL01 Duplicate prevention — Country and bank identifiers should be validated before creating a new institution or branch." },

    { module: "Cash Management", q: "Why should obsolete branches be end-dated rather than deleted?",
      options: ["A) To save storage", "B) Because existing accounts and transactions still reference the history", "C) Because Oracle doesn't allow deletion", "D) To improve performance"],
      correctIndex: 1,
      explanation: "CONTROL03 Inactive-data policy — End-date obsolete branches rather than deleting history used by existing accounts and transactions." },

    { module: "Cash Management", q: "Which changes could redirect payments?",
      options: ["A) Changing bank name", "B) Routing and identity changes", "C) Changing branch address", "D) Changing contact person"],
      correctIndex: 1,
      explanation: "CONTROL02 Change approval — Routing and identity changes can redirect funds and require independent evidence." },

    { module: "Cash Management", q: "Internal bank accounts combine all of the following EXCEPT:",
      options: ["A) Ownership", "B) Security", "C) Depreciation", "D) Statement processing"],
      correctIndex: 2,
      explanation: "Internal bank accounts combine ownership, security, accounting, payment/receipt uses, statement processing, and transfer behavior." },

    { module: "Cash Management", q: "What authorizes an internal account for payables disbursement, receivables remittance, payroll, or other cash purposes?",
      options: ["A) Account access", "B) Account use", "C) Bank transfer", "D) Cash forecast"],
      correctIndex: 1,
      explanation: "Account use — Authorizes an internal account for payables disbursement, receivables remittance, payroll, or other cash purposes." },

    { module: "Cash Management", q: "What restricts who can use or view an account by business unit, legal entity, and role?",
      options: ["A) Account use", "B) Account access", "C) Bank transfer", "D) Cash forecast"],
      correctIndex: 1,
      explanation: "Account access — Restricts who can use or view an account by business unit, legal entity, and role." },

    { module: "Cash Management", q: "What moves cash between internal accounts and records the corresponding outflow, inflow, fees, and clearing?",
      options: ["A) Account use", "B) Bank transfer", "C) Cash forecast", "D) Account access"],
      correctIndex: 1,
      explanation: "Bank transfer — Moves cash between internal accounts and records the corresponding outflow, inflow, fees, and clearing." },

    { module: "Cash Management", q: "In the five-step configuration path for Bank Accounts, what comes immediately after 'Create account'?",
      options: ["A) Configure accounting", "B) Assign uses/access", "C) Process transfer", "D) Build position"],
      correctIndex: 1,
      explanation: "Step 1 Create account → Step 2 Assign uses/access → Step 3 Configure accounting → Step 4 Process transfer → Step 5 Build position." },

    { module: "Cash Management", q: "Which step involves setting cash, cash clearing, bank charges, transfer, and reconciliation accounts?",
      options: ["A) Create account", "B) Assign uses/access", "C) Configure accounting", "D) Process transfer"],
      correctIndex: 2,
      explanation: "Step 3 Configure accounting — Set cash, cash clearing, bank charges, transfer, and reconciliation accounts." },

    { module: "Cash Management", q: "What does 'Build position' involve?",
      options: ["A) Creating a bank account", "B) Grouping accounts and including bank balances, system transactions, and forecasts by value date", "C) Processing transfers", "D) Setting up accounting"],
      correctIndex: 1,
      explanation: "Step 5 Build position — Group accounts and include bank balances, system transactions, and forecasts by value date." },

    { module: "Cash Management", q: "Which control limits visibility of account numbers and bank details to users with a business need?",
      options: ["A) Dual approval", "B) Sensitive data", "C) Value-date discipline", "D) Duplicate prevention"],
      correctIndex: 1,
      explanation: "CONTROL01 Sensitive data — Limit visibility of account numbers and bank details to users with a business need." },

    { module: "Cash Management", q: "High-value transfers should require:",
      options: ["A) Single approval", "B) Independent authorization and verified destination accounts", "C) No approval", "D) Only system validation"],
      correctIndex: 1,
      explanation: "CONTROL02 Dual approval — High-value transfers should require independent authorization and verified destination accounts." },

    { module: "Cash Management", q: "Liquidity reporting should use bank value dates and currency assumptions consistently. This is:",
      options: ["A) Sensitive data", "B) Dual approval", "C) Value-date discipline", "D) Duplicate prevention"],
      correctIndex: 2,
      explanation: "CONTROL03 Value-date discipline — Liquidity reporting should use bank value dates and currency assumptions consistently." },

    { module: "Cash Management", q: "What is the difference between account use and access?",
      options: ["A) No difference", "B) Use authorizes purpose; access restricts who can view/use by BU, legal entity, role", "C) Access authorizes purpose; use restricts who can view", "D) Both are the same"],
      correctIndex: 1,
      explanation: "Account use authorizes purpose (AP, AR, payroll). Account access restricts who can use or view an account by business unit, legal entity, and role." },

    { module: "Cash Management", q: "Which accounts are needed for a bank transfer?",
      options: ["A) Only source account", "B) Only destination account", "C) Both source and destination internal accounts, plus clearing accounts", "D) No accounts needed"],
      correctIndex: 2,
      explanation: "A bank transfer moves cash between internal accounts and records outflow, inflow, fees, and clearing — so both sides plus clearing are needed." },

    { module: "Cash Management", q: "Why does value date matter in liquidity reporting?",
      options: ["A) It doesn't matter", "B) It determines when cash actually affects the bank balance, not just when the transaction was entered", "C) It's only for reporting", "D) It's the same as accounting date"],
      correctIndex: 1,
      explanation: "Value-date discipline ensures liquidity reporting uses bank value dates consistently — the actual date funds are available." },

    // ===== FIXED ASSETS =====
    { module: "Fixed Assets", q: "What defines financial or tax depreciation rules, calendar, currency, accounts, and transaction control?",
      options: ["A) Asset category", "B) Asset book", "C) Depreciation", "D) CIP"],
      correctIndex: 1,
      explanation: "Asset book — Defines financial or tax depreciation rules, calendar, currency, accounts, and transaction control." },

    { module: "Fixed Assets", q: "What defaults accounts, depreciation method, life, conventions, and descriptive classification?",
      options: ["A) Asset book", "B) Asset category", "C) Depreciation", "D) CIP"],
      correctIndex: 1,
      explanation: "Asset category — Defaults accounts, depreciation method, life, conventions, and descriptive classification." },

    { module: "Fixed Assets", q: "What allocates depreciable cost across periods using method, life, rate, convention, and in-service date?",
      options: ["A) Asset book", "B) Asset category", "C) Depreciation", "D) CIP"],
      correctIndex: 2,
      explanation: "Depreciation — Allocates depreciable cost across periods using method, life, rate, convention, and in-service date." },

    { module: "Fixed Assets", q: "What accumulates project or construction costs without depreciation until capitalization?",
      options: ["A) Asset book", "B) Asset category", "C) Depreciation", "D) Construction in Progress (CIP)"],
      correctIndex: 3,
      explanation: "Construction in Progress — Accumulates project or construction costs without depreciation until capitalization into one or more assets." },

    { module: "Fixed Assets", q: "In the five-step configuration path for Assets, what is Step 1?",
      options: ["A) Create categories", "B) Configure book", "C) Set methods/conventions", "D) Add assets"],
      correctIndex: 1,
      explanation: "Step 1 Configure book — Define calendar, currency, accounting rules, depreciation settings, and ledger integration." },

    { module: "Fixed Assets", q: "What does 'Create categories' involve?",
      options: ["A) Defining calendar", "B) Assigning asset cost, clearing, depreciation expense, reserve, retirement, and CIP accounts", "C) Setting useful lives", "D) Adding assets"],
      correctIndex: 1,
      explanation: "Step 2 Create categories — Assign asset cost, clearing, depreciation expense, reserve, retirement, and CIP accounts." },

    { module: "Fixed Assets", q: "Which step creates approved useful lives, rates, prorate conventions, and ceilings?",
      options: ["A) Configure book", "B) Create categories", "C) Set methods/conventions", "D) Add assets"],
      correctIndex: 2,
      explanation: "Step 3 Set methods/conventions — Create approved useful lives, rates, prorate conventions, and ceilings where applicable." },

    { module: "Fixed Assets", q: "What does 'Capitalize' step involve?",
      options: ["A) Creating categories", "B) Reviewing accumulated cost, allocating to final assets, setting dates/categories, and starting depreciation", "C) Adding manual assets", "D) Setting methods"],
      correctIndex: 1,
      explanation: "Step 5 Capitalize — Review accumulated cost, allocate to final assets, set dates/categories, and start depreciation." },

    { module: "Fixed Assets", q: "Which control requires Finance to define thresholds, eligible costs, useful lives, and componentization rules?",
      options: ["A) Date accuracy", "B) Capitalization policy", "C) CIP aging", "D) Clearing reconciliation"],
      correctIndex: 1,
      explanation: "CONTROL01 Capitalization policy — Finance must define thresholds, eligible costs, useful lives, and componentization rules." },

    { module: "Fixed Assets", q: "Which dates directly affect depreciation and period cutoff?",
      options: ["A) Creation date", "B) In-service and prorate dates", "C) Purchase date", "D) Approval date"],

// ============ STATE ============
const state = {
    currentIndex: 0,
    userAnswers: {},       // { qIndex: { selected, correct } }
    activeFilter: 'all',
    visibleIndexes: []     // indexes of questions currently visible based on filter
};

// ============ DOM ============
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const feedbackTitle = document.getElementById('feedback-title');
const feedbackEncouragement = document.getElementById('feedback-encouragement');
const explanationEl = document.getElementById('explanation');
const progressText = document.getElementById('progress-text');
const progressBar = document.getElementById('progress-bar');
const moduleBadge = document.getElementById('module-badge');
const questionGrid = document.getElementById('question-grid');
const scoreDisplay = document.getElementById('score-display');
const nextBtnTop = document.getElementById('next-btn-top');
const prevBtn = document.getElementById('prev-btn');
const nextBtnBottom = document.getElementById('next-btn-bottom');

const successMessages = ["عاش يا منون! 🌟", "الله عليكي يا بشمهندسة! 👏", "إجابة بيرفكت! 💖", "شطورة جداً! ✨", "كده يا قمر! 🌸", "برافو عليكي! 🎉"];
const failMessages = ["ولا يهمك، ركزي في اللي جاي! 💪", "عادي جداً، اقري الشرح وهتثبت! 🌸", "مفيش مشكلة، احنا بنتعلم! 💖", "المهم تفهمي السبب! 📚"];

// ============ FILTERS ============
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.activeFilter = btn.dataset.module;
        applyFilter();
    });
});

function applyFilter() {
    if (state.activeFilter === 'all') {
        state.visibleIndexes = allQuestions.map((_, i) => i);
    } else {
        state.visibleIndexes = allQuestions
            .map((q, i) => q.module === state.activeFilter ? i : -1)
            .filter(i => i !== -1);
    }

    if (state.visibleIndexes.length === 0) return;

    // If current is not in visible indexes, jump to first visible
    if (!state.visibleIndexes.includes(state.currentIndex)) {
        state.currentIndex = state.visibleIndexes[0];
    }

    buildQuestionGrid();
    loadQuestion();
}

// ============ BUILD GRID ============
function buildQuestionGrid() {
    questionGrid.innerHTML = '';
    allQuestions.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'q-num';
        btn.textContent = i + 1;
        btn.dataset.index = i;

        if (!state.visibleIndexes.includes(i)) {
            btn.classList.add('hidden');
        }

        const ans = state.userAnswers[i];
        if (ans) {
            btn.classList.add(ans.correct ? 'correct' : 'wrong');
        }
        if (i === state.currentIndex) {
            btn.classList.add('current');
        }

        btn.onclick = () => jumpToQuestion(i);
        questionGrid.appendChild(btn);
    });
}

function updateGridCurrent() {
    questionGrid.querySelectorAll('.q-num').forEach(btn => {
        btn.classList.toggle('current', parseInt(btn.dataset.index) === state.currentIndex);
    });
    // Scroll current into view
    const currentBtn = questionGrid.querySelector('.q-num.current');
    if (currentBtn) currentBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function updateGridAnswer(index) {
    const btn = questionGrid.querySelector(`.q-num[data-index="${index}"]`);
    if (!btn) return;
    btn.classList.remove('correct', 'wrong');
    const ans = state.userAnswers[index];
    if (ans) btn.classList.add(ans.correct ? 'correct' : 'wrong');
}

// ============ NAVIGATION ============
function jumpToQuestion(index) {
    if (!state.visibleIndexes.includes(index)) return;
    state.currentIndex = index;
    updateGridCurrent();
    loadQuestion();
}

function prevQuestion() {
    const pos = state.visibleIndexes.indexOf(state.currentIndex);
    if (pos > 0) {
        jumpToQuestion(state.visibleIndexes[pos - 1]);
    }
}

function nextQuestion() {
    const pos = state.visibleIndexes.indexOf(state.currentIndex);
    if (pos < state.visibleIndexes.length - 1) {
        jumpToQuestion(state.visibleIndexes[pos + 1]);
    } else {
        showResults();
    }
}

// ============ LOAD QUESTION ============
function loadQuestion() {
    feedbackEl.style.display = 'none';
    feedbackEl.className = 'feedback';
    nextBtnBottom.style.display = 'none';
    optionsEl.innerHTML = '';

    const q = allQuestions[state.currentIndex];
    questionEl.innerText = q.q;
    moduleBadge.innerText = q.module;

    const pos = state.visibleIndexes.indexOf(state.currentIndex);
    progressText.innerText = `سؤال ${state.currentIndex + 1} من ${allQuestions.length} (${pos + 1} من ${state.visibleIndexes.length} في الفلتر)`;
    progressBar.style.width = `${((state.currentIndex + 1) / allQuestions.length) * 100}%`;

    // Prev / Next disabled?
    prevBtn.disabled = pos <= 0;
    const isLast = pos >= state.visibleIndexes.length - 1;
    nextBtnTop.textContent = isLast ? 'النتيجة 🏁' : 'التالي ➡️';

    // If already answered - show result
    const existing = state.userAnswers[state.currentIndex];

    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.dataset.index = index;

        if (existing) {
            btn.disabled = true;
            if (index === q.correctIndex) btn.classList.add('correct');
            if (index === existing.selected && !existing.correct) btn.classList.add('wrong');
        } else {
            btn.onclick = () => checkAnswer(index, btn);
        }
        optionsEl.appendChild(btn);
    });

    if (existing) {
        showFeedback(existing.correct, q.explanation);
    }

    updateScoreDisplay();
    updateGridCurrent();
}

function checkAnswer(selectedIndex, btn) {
    const q = allQuestions[state.currentIndex];
    const allBtns = optionsEl.children;

    for (let i = 0; i < allBtns.length; i++) {
        allBtns[i].disabled = true;
        if (i === q.correctIndex) allBtns[i].classList.add('correct');
    }

    const isCorrect = selectedIndex === q.correctIndex;
    if (!isCorrect) btn.classList.add('wrong');

    state.userAnswers[state.currentIndex] = { selected: selectedIndex, correct: isCorrect };

    updateGridAnswer(state.currentIndex);
    showFeedback(isCorrect, q.explanation);
    updateScoreDisplay();
}

function showFeedback(isCorrect, explanation) {
    if (isCorrect) {
        feedbackTitle.innerText = "صح! 🎉";
        feedbackTitle.style.color = "#28a745";
        feedbackEl.classList.add('correct-bg');
        feedbackEncouragement.innerText = successMessages[Math.floor(Math.random() * successMessages.length)];
    } else {
        feedbackTitle.innerText = "غلط 🥺";
        feedbackTitle.style.color = "#dc3545";
        feedbackEl.classList.add('wrong-bg');
        feedbackEncouragement.innerText = failMessages[Math.floor(Math.random() * failMessages.length)];
    }
    explanationEl.innerHTML = `<strong>السبب (Explanation):</strong><br> ${explanation}`;
    feedbackEl.style.display = 'block';

    const pos = state.visibleIndexes.indexOf(state.currentIndex);
    const isLast = pos >= state.visibleIndexes.length - 1;
    if (isLast) {
        nextBtnBottom.innerText = 'عرض النتيجة النهائية 🏁';
    } else {
        nextBtnBottom.innerText = 'السؤال اللي بعده يا بطلة 🚀';
    }
    nextBtnBottom.style.display = 'block';
}

function updateScoreDisplay() {
    const total = Object.keys(state.userAnswers).length;
    const correct = Object.values(state.userAnswers).filter(a => a.correct).length;
    scoreDisplay.innerText = `النتيجة: ${correct} / ${total}`;
}

// ============ RESULTS ============
function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    const answered = Object.keys(state.userAnswers).length;
    const correct = Object.values(state.userAnswers).filter(a => a.correct).length;
    const wrong = answered - correct;

    document.getElementById('stat-total').innerText = allQuestions.length;
    document.getElementById('stat-correct').innerText = correct;
    document.getElementById('stat-wrong').innerText = wrong;

    const pct = answered > 0 ? (correct / answered) : 0;
    document.getElementById('final-score').innerText = `${Math.round(pct * 100)}% (${correct}/${answered})`;

    const msgEl = document.getElementById('final-message');
    if (answered === 0) {
        msgEl.innerText = "لسه مجاوبتيش على أي سؤال يا قمر، يلا ابدئي! 💪🌸";
    } else if (pct === 1) {
        msgEl.innerText = "ايه الحلاوة دي! انتي جاهزة تقفلي الامتحان وانتي حاطة رجل على رجل! 😎👑";
    } else if (pct >= 0.7) {
        msgEl.innerText = "عاش جداً يا منون! مستواكي ممتاز، راجعي بس على الكام سؤال اللي فاتوا وهتبقي وحش! 🚀💖";
    } else if (pct >= 0.5) {
        msgEl.innerText = "كده تمام يا قمر! محتاجة تراجعي شوية كمان وهتبقي جاهزة! 💪🌸";
    } else {
        msgEl.innerText = "ولا يهمك خالص! راجعي الشرح وادخلي جربي تاني، انتي هتقفليها! 💪🌸";
    }
}

function resetQuiz() {
    state.currentIndex = 0;
    state.userAnswers = {};
    state.activeFilter = 'all';

    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-module="all"]').classList.add('active');

    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';

    applyFilter();
    updateScoreDisplay();
}

// ============ INIT ============
applyFilter();
updateScoreDisplay();
</script>
