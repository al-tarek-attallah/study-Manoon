<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان منون العبقرية 🌸✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 143, 171, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border: 3px solid #ffb3c6;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #d90429;
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #ff4d6d;
            font-weight: 700;
            font-size: 1.2em;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #ffeff3;
            border-radius: 10px;
            height: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff758f, #ff4d6d);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Question Area */
        .question-text {
            font-family: Arial, sans-serif;
            direction: ltr; /* English text */
            text-align: left;
            font-size: 1.3em;
            color: #2b2d42;
            margin-bottom: 20px;
            font-weight: bold;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #ff4d6d;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            direction: ltr;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #4a4e69;
            font-family: Arial, sans-serif;
        }

        .option-btn:hover {
            background-color: #fff0f3;
            border-color: #ff8fa3;
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            transform: none;
        }

        /* Correct / Incorrect states */
        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        /* Feedback & Explanation */
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.5s;
        }

        .feedback.correct-bg {
            background-color: #e6ffed;
            border: 2px solid #a3e6b5;
        }

        .feedback.wrong-bg {
            background-color: #fff0f0;
            border: 2px solid #ffcaca;
        }

        .feedback-title {
            font-size: 1.5em;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .explanation {
            font-family: Arial, sans-serif;
            direction: ltr;
            text-align: left;
            color: #333;
            font-size: 1.1em;
            line-height: 1.5;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* Next Button */
        .next-btn {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            display: none;
            box-shadow: 0 5px 15px rgba(201, 24, 74, 0.4);
            transition: 0.3s;
        }

        .next-btn:hover {
            transform: scale(1.02);
        }

        /* Results Screen */
        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen img {
            width: 150px;
            margin-bottom: 20px;
        }

        .result-screen h2 {
            color: #c9184a;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f2d74e;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        
        <!-- Screen 1: Quiz -->
        <div id="quiz-screen">
            <div class="header">
                <h1>مراجعة الأبطال لمنون 🌸✨</h1>
                <p id="progress-text">سؤال 1 من 10</p>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="question-text" id="question">Loading question...</div>
            
            <div class="options-container" id="options">
                <!-- Options will be injected here -->
            </div>

            <div class="feedback" id="feedback">
                <div class="feedback-title" id="feedback-title"></div>
                <div id="feedback-encouragement" style="font-weight:bold; margin-bottom: 10px;"></div>
                <div class="explanation" id="explanation"></div>
            </div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال اللي بعده يا بطلة 🚀</button>
        </div>

        <!-- Screen 2: Result -->
        <div class="result-screen" id="result-screen">
            <h2>خلصنا يا قمر! 🎉</h2>
            <div style="font-size: 5em; margin: 20px 0;">💖🎓</div>
            <h3 style="font-size: 2em; color: #2b2d42;">نتيجتك: <span id="final-score" style="color: #d90429;"></span></h3>
            <p id="final-message" style="font-size: 1.5em; margin-top: 20px; color: #4a4e69;"></p>
            <button class="next-btn" style="display: block; width: 50%; margin: 30px auto;" onclick="location.reload()">عايزة تعيدي تاني؟ 🔄</button>
        </div>

    </div>

    <script>
        // === Data: Here are 10 questions from your provided files ===
        const questions = [
            {
                q: "What is the primary purpose of a Chart of Accounts Structure Instance in Oracle Fusion General Ledger?",
                options: [
                    "A) To define the number of segments in the chart of accounts",
                    "B) To act as an enabled, ledger-ready copy of the Chart of Accounts structure",
                    "C) To store the physical segment values such as company codes and cost centers",
                    "D) To map legacy account values to the new Oracle Fusion account values"
                ],
                correctIndex: 1,
                explanation: "A structure instance is an enabled, ledger-ready copy of the Chart of Accounts structure. It assigns specific value sets to the segments defined in the structure so they can be utilized by a ledger."
            },
            {
                q: "In the context of General Ledger, what does the 'Balancing Segment' qualifier do?",
                options: [
                    "A) It identifies the segment used to track the natural classification of transactions.",
                    "B) It ensures that all journal entries are balanced (total debits equal total credits) for each value of this segment.",
                    "C) It designates the segment used to record intercompany transactions.",
                    "D) It defines the period frequency for the accounting calendar."
                ],
                correctIndex: 1,
                explanation: "The Balancing Segment qualifier ensures that transactions balance at the specified segment level (usually the Company or Legal Entity), which is a mandatory requirement for generating complete financial statements."
            },
            {
                q: "What is the primary difference between a Primary Ledger and a Secondary Ledger in Oracle Fusion?",
                options: [
                    "A) Primary is for daily transactions, Secondary is for budget data.",
                    "B) Primary represents the main record-keeping ledger, Secondary represents an alternate accounting representation of the same data.",
                    "C) Primary is for operational reporting, Secondary is for subledger accounting.",
                    "D) Primary requires a unique COA, Secondary must share the COA with the Primary."
                ],
                correctIndex: 1,
                explanation: "A Primary Ledger acts as the main corporate record for financial data, while a Secondary Ledger provides an alternate accounting representation (e.g., different currency, calendar, or accounting method)."
            },
            {
                q: "In Oracle Payables, what is a 'Payment Process Request' (PPR)?",
                options: [
                    "A) A request sent to a supplier to negotiate a payment discount.",
                    "B) An automated engine that selects invoices, builds payments, and formats payment files.",
                    "C) A manual journal entry to record a bank transfer.",
                    "D) A formal dispute logged against a supplier invoice."
                ],
                correctIndex: 1,
                explanation: "A Payment Process Request (PPR) is the automated process in Payables used to select multiple invoices based on criteria, group them, build the payments, and generate the payment files."
            },
            {
                q: "What is the difference between an Invoice Validation process and an Invoice Approval process?",
                options: [
                    "A) Validation routes the invoice to a manager; Approval checks for matching errors.",
                    "B) Validation is a system check for completeness and accuracy; Approval is a workflow routing to human users for authorization.",
                    "C) Validation generates the payment file; Approval releases the funds.",
                    "D) Validation only applies to manual invoices; Approval only applies to imported invoices."
                ],
                correctIndex: 1,
                explanation: "Validation is an automated system process that checks for variances, tax, and accounts. Approval is an optional workflow process where managers review and authorize the invoice."
            },
            {
                q: "In Payables, how does a 'Standard' invoice differ from a 'Prepayment' invoice?",
                options: [
                    "A) A Standard invoice represents an expense; a Prepayment represents an advance payment to a supplier that will be applied against future invoices.",
                    "B) A Standard invoice is always matched to a PO; a Prepayment is never matched to a PO.",
                    "C) A Standard invoice creates a liability; a Prepayment creates an immediate revenue entry.",
                    "D) A Standard invoice requires approval; a Prepayment bypasses all approvals."
                ],
                correctIndex: 0,
                explanation: "A Prepayment is an advance given to a supplier (creating a prepaid asset) which is later applied to a Standard invoice (liability) to reduce the amount owed."
            },
            {
                q: "In Oracle Receivables, what is the purpose of an 'AutoCash Rule Set'?",
                options: [
                    "A) To automatically generate invoices based on a recurring schedule.",
                    "B) To apply receipts automatically to open customer balances using an ordered set of matching rules.",
                    "C) To calculate automatic late charges on overdue invoices.",
                    "D) To import bank statements into the Cash Management module."
                ],
                correctIndex: 1,
                explanation: "An AutoCash Rule Set applies receipts automatically using an ordered set of matching and balance rules (e.g., matching to the oldest invoice first) to streamline cash application."
            },
            {
                q: "What is the fundamental difference between a Party and a Customer Account in the Trading Community Architecture (TCA)?",
                options: [
                    "A) A Party represents the commercial billing relationship, while an Account represents the legal entity.",
                    "B) A Party is an entity that exists independently, while a Customer Account represents the commercial relationship established with that Party.",
                    "C) A Party is used exclusively in Payables, while a Customer Account is used exclusively in Receivables.",
                    "D) A Party stores payment terms, while an Account stores the mailing address."
                ],
                correctIndex: 1,
                explanation: "In TCA, a Party is the physical or legal entity. A Customer Account is created only when you establish a financial selling relationship with that Party to handle billing, receipts, and credit."
            },
            {
                q: "What is the function of 'Construction in Progress' (CIP) in the Fixed Assets module?",
                options: [
                    "A) It calculates accelerated depreciation for newly acquired assets.",
                    "B) It accumulates project or construction costs without depreciating them until the costs are capitalized into one or more assets.",
                    "C) It automatically pays suppliers for construction invoices.",
                    "D) It revalues assets based on current market construction costs."
                ],
                correctIndex: 1,
                explanation: "CIP accumulates project or construction costs without depreciation until capitalization into one or more assets. CIP assets do not depreciate."
            },
            {
                q: "In Oracle Fusion Tax, what is the role of 'Tax Determination'?",
                options: [
                    "A) To manually enter the tax amount on every AP invoice line.",
                    "B) To generate the final tax report for the legal authorities.",
                    "C) To perform a rule-driven evaluation that decides which taxes apply, where they apply, and how they are calculated.",
                    "D) To restrict user access to the tax configuration screens."
                ],
                correctIndex: 2,
                explanation: "Tax determination is a rule-driven evaluation that decides which taxes apply, where they apply, and how they are calculated consistently across Payables, Receivables, and GL."
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackEncouragement = document.getElementById('feedback-encouragement');
        const explanationEl = document.getElementById('explanation');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');

        const successMessages = ["عاش يا منون! 🌟", "الله عليكي يا بشمهندسة! 👏", "إجابة بيرفكت! 💖", "شطورة جداً! ✨"];
        const failMessages = ["ولا يهمك، ركزي في اللي جاي! 💪", "عادي جداً، اقري الشرح وهتثبت! 🌸", "مفيش مشكلة، احنا بنتعلم! 💖"];

        function loadQuestion() {
            // Reset state
            feedbackEl.style.display = 'none';
            feedbackEl.className = 'feedback';
            nextBtn.style.display = 'none';
            optionsEl.innerHTML = '';

            const q = questions[currentQuestion];
            questionEl.innerText = q.q;

            // Update Progress
            progressText.innerText = `سؤال ${currentQuestion + 1} من ${questions.length}`;
            progressBar.style.width = `${((currentQuestion) / questions.length) * 100}%`;

            // Create buttons
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsEl.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btn) {
            const q = questions[currentQuestion];
            const allBtns = optionsEl.children;

            // Disable all buttons
            for(let i=0; i<allBtns.length; i++) {
                allBtns[i].disabled = true;
                // Reveal correct answer
                if(i === q.correctIndex) {
                    allBtns[i].classList.add('correct');
                }
            }

            // Check if correct
            if(selectedIndex === q.correctIndex) {
                score++;
                btn.classList.add('correct');
                feedbackTitle.innerText = "صح! 🎉";
                feedbackTitle.style.color = "#28a745";
                feedbackEl.classList.add('correct-bg');
                feedbackEncouragement.innerText = successMessages[Math.floor(Math.random() * successMessages.length)];
            } else {
                btn.classList.add('wrong');
                feedbackTitle.innerText = "غلط 🥺";
                feedbackTitle.style.color = "#dc3545";
                feedbackEl.classList.add('wrong-bg');
                feedbackEncouragement.innerText = failMessages[Math.floor(Math.random() * failMessages.length)];
            }

            // Show explanation
            explanationEl.innerHTML = `<strong>السبب (Explanation):</strong><br> ${q.explanation}`;
            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';
            
            // Update progress bar properly
            progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
        }

        function nextQuestion() {
            currentQuestion++;
            if(currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            const resScreen = document.getElementById('result-screen');
            resScreen.style.display = 'block';
            
            document.getElementById('final-score').innerText = `${score} من ${questions.length}`;
            
            const msgEl = document.getElementById('final-message');
            const percentage = score / questions.length;

            if(percentage === 1) {
                msgEl.innerText = "ايه الحلاوة دي! انتي جاهزة تقفلي الامتحان وانتي حاطة رجل على رجل! 😎👑";
                createConfetti();
            } else if(percentage >= 0.7) {
                msgEl.innerText = "عاش جداً يا منون! مستواكي ممتاز، راجعي بس على الكام سؤال اللي فاتوا وهتبقي وحش! 🚀💖";
            } else {
                msgEl.innerText = "ولا يهمك خالص! الامتحان ده معمول عشان تغلطي وتتعلمي، اقري الشرح كويس وادخلي جربي تاني! 💪🌸";
            }
        }

        // Fun Confetti Effect for full mark
        function createConfetti() {
            const colors = ['#ff4d6d', '#ff8fa3', '#ffb3c6', '#d90429', '#f2d74e'];
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(conf);
            }
        }

        // Start Quiz
        loadQuestion();
    </script>
</body>
</html>
